site_name: PJLink Plus
site_description: Find and control PJLink projectors from Home Assistant.
site_url: https://vltmedia.github.io/PJLink-Plus-Home-Assistant-Integration/
repo_url: https://github.com/vltmedia/PJLink-Plus-Home-Assistant-Integration
repo_name: vltmedia/PJLink-Plus-Home-Assistant-Integration
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  icon:
    logo: material/projector
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Adding a projector: setup.md
  - Entities: entities.md
  - Remote and services: commands.md
  - Automation examples: examples.md
  - What PJLink cannot do: limitations.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
